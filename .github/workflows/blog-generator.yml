name: Generate blog post

on:
  schedule:
    - cron: "0 8 * * 1,3,5" # Mon/Wed/Fri 08:00 UTC
  workflow_dispatch: {}      # manual "Run workflow" button in GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog generation
        run: |
          # -f alone hides WHY a run failed; print status + body, then fail on non-2xx.
          body=$(mktemp)
          code=$(curl -s -o "$body" -w "%{http_code}" -X POST "https://servolia.com/api/cron/generate-blog" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"; cat "$body"; echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
