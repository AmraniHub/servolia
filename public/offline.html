<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hors ligne — Servolia</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #FAFAF7; color: #18181B; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  .card {
    max-width: 380px; width: 100%; text-align: center;
    background: #fff; border: 1px solid #E8E6E0; border-radius: 16px; padding: 32px 24px;
  }
  img { width: 56px; height: 56px; border-radius: 14px; display: block; margin: 0 auto 18px; }
  h1 { font-size: 19px; font-weight: 800; margin: 0 0 10px; }
  p { font-size: 14px; line-height: 1.6; color: #52525B; margin: 0 0 20px; }
  button {
    background: #36671E; color: #FAFAF7; border: 0; border-radius: 10px;
    padding: 12px 24px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0F1410; color: #F4F4F2; }
    .card { background: #171C18; border-color: #2A322C; }
    p { color: #C9CCC7; }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="Servolia" />
    <h1>Pas de connexion</h1>
    <p>
      Votre espace client a besoin d&rsquo;internet pour afficher vos demandes en temps réel.
      Reconnectez-vous et réessayez — rien n&rsquo;est perdu.
    </p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
